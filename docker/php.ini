; Limites adaptées à la petite instance gratuite et aux rapports PDF ABIWEIN.
memory_limit=256M
max_execution_time=60
upload_max_filesize=10M
post_max_size=12M

; Réglages de production : erreurs journalisées, jamais affichées aux visiteurs.
display_errors=Off
log_errors=On
expose_php=Off

; Le cache d'opcodes réduit le temps de réponse après le réveil du service.
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=96
