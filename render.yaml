# Blueprint Render : l'application utilise Docker et le plan gratuit.
services:
  - type: web
    name: abiwein
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: ABIWEIN
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_TIMEZONE
        value: Africa/Douala
      - key: APP_LOCALE
        value: fr
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
      - key: ABIWEIN_ENABLE_PRODUCTION_DEMO
        value: "true"
      - key: ABIWEIN_DEMO_ADMIN_EMAIL
        sync: false
      - key: ABIWEIN_DEMO_ADMIN_PASSWORD
        sync: false
      - key: ABIWEIN_DEMO_MANAGER_EMAIL
        sync: false
      - key: ABIWEIN_DEMO_MANAGER_PASSWORD
        sync: false
      - key: ABIWEIN_DEMO_VET_EMAIL
        sync: false
      - key: ABIWEIN_DEMO_VET_PASSWORD
        sync: false
